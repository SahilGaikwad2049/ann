<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Minute Cryptic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/cryptic.css">
</head>

<body>

<div class="phone">

    <!-- Header -->
    <div class="app-header">


        <div class="header-center">
            <div class="header-date" id="headerDate">
                2 September, 2026
            </div>

            <div class="header-byline" id="headerByline">
                By Sahil
            </div>
        </div>

    </div>


    <!-- Clue -->
    <div class="clue-card">
        <div class="clue-text" id="clueText"></div>
    </div>


    <!-- Answer tiles -->
    <div class="tiles-row" id="tilesRow"></div>


    <!-- Hints -->
    <div class="hint-panel hidden" id="hintPanel"></div>


    <!-- Result -->
    <div class="result-msg" id="resultMsg"></div>


    <!-- Action buttons -->
    <div class="action-row">

        <button class="pill-btn hints-btn" id="hintButton">
            hints
        </button>

        <button class="pill-btn check-btn" id="checkButton">
            check
        </button>

    </div>


    <!-- Next clue -->
    <button class="next-button hidden" id="nextButton">
        Next clue →
    </button>


    <!-- Keyboard -->
    <div class="keyboard" id="keyboard">

        <div class="kb-row">

            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>

        </div>


        <div class="kb-row">

            <span class="kb-spacer"></span>

            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>

            <span class="kb-spacer"></span>

        </div>


        <div class="kb-row">

            <button class="key key-wide" data-key="ENTER">
                enter
            </button>

            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>

            <button class="key key-wide" data-key="BACK">
                ⌫
            </button>

        </div>

    </div>

</div>

<script src="js/cryptic.js"></script>

</body>
</html>
